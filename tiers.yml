# dsh-graft-slice 7.2.0 — 真机验收三档配置
#
# 用法：把选定档位的两行抄进
# `<home>\.dsh\profiles\desktop\cordis.patch.yml` 的 dsh-graft-slice 段，
# 然后重启桌面端。其余字段三档完全相同。
#
# ── 关键实测（真实会话 session-legacy-fixture，14 轮 / 3,882 事件）─────────────────
#
#   档位   重放轮数   总字符    可回读指针
#   A      0          2,076     342
#   B      1          7,597     342
#   C      4         35,874     342
#
# 三条结论，都有测试守着：
#
#   1. 回读句柄与重放轮数无关。A 和 C 都是 342 条 —— 重放轮次没有增加检索能力，
#      只增加了体积。这是 7.2 把 debug 模式改成零重放的依据。
#   2. C 比 A 大 17 倍，换来的只是「最近几轮的原话」。任务复杂时值得，连续调试
#      时是灾难：debug 的近期内容是最不可压缩的堆栈墙。
#   3. 零重放不等于失明。Goal / Task Status / Workspace Files / Pending-State
#      （含最后一条报错原文，≤2000 字符）/ 全量回读索引 / 未迁移后台工作，六块都在。
#
# ── 关于 compaction-basic 的 auto: false（重要）─────────────────────────────
#
# profile 里对 compaction-basic 设了 `auto: false`，这会**同时关掉 DSH 自带的
# 溢出恢复**。原因是同一个开关同时控制两件事：
#
#     if (this.config.auto) this._registerAutomaticCompaction()
#
# 而这个注册包含了三个监听器：pre-step 压力检查、agent/request-error 溢出恢复、
# agent/status 清理。关掉 auto 等于三者全关。
#
# 影响：
#   - DSH 的压缩引擎不再自动搬运上下文（这正是我们要的，它是有损的）；
#   - 它也不再在 CONTEXT_WINDOW_EXCEEDED 时自我救援（这是我们用 P6 补上的）。
#
# 本插件的 P6 监听同一个 `agent/request-error` 事件，检测 `failure.code ===
# 'CONTEXT_WINDOW_EXCEEDED'` 后自行迁移并返回 `{ kind: 'retry' }`。所以溢出恢复
# 是**可达的**，但只由本插件提供 —— 没有第二层保险。
#
# 如果要保留 DSH 自己的兜底，把 `auto` 改回 true，代价是两套压缩机制同时监听
# `agent/pre-step`，顺序不可控（见 README 的限制章节）。

# ─────────────────────────────────────────────────────────────────────────────
# 档位 A（默认 · 纯检索，v7.3 起）
#   完全不重放。只读结构化载荷 + 全量回读索引。
#   实测约 2,076 字符。
#   回答的问题：结构化载荷本身够不够？
# ─────────────────────────────────────────────────────────────────────────────
# recentTurns: 0
# adaptiveDepth: false

# ─────────────────────────────────────────────────────────────────────────────
# 档位 B（最小线程）
#   只保留最后 1 轮原话。实测约 7,597 字符。
#   回答的问题：一轮原话是不是那个决定性的差额？
# ─────────────────────────────────────────────────────────────────────────────
# recentTurns: 1
# adaptiveDepth: false

# ─────────────────────────────────────────────────────────────────────────────
# 档位 C（对照组 · 也是源码默认值）
#   自适应深度，上限 5 轮（= recentTurns 默认 5 + adaptiveDepth 默认 true）。
#   实测约 35,874 字符。
#   注意：7.2 起 debug 模式会自适应降到 0 轮，所以 C 档在连续调试中不会失控。
#   回答的问题：多用 30k 字符的重放，换来了什么？
#
#   v7.4 起这一档与 src/index.ts 的 normalizeConfig 默认值逐字一致，
#   所以"不改配置"跑出来的就是 C 档 —— 以前它写的是 0/false，
#   与注释、README、源码四处互相矛盾。
# ─────────────────────────────────────────────────────────────────────────────
recentTurns: 5
adaptiveDepth: true

# ─────────────────────────────────────────────────────────────────────────────
# 三档共同的其余配置（不要随档位改动）
# ─────────────────────────────────────────────────────────────────────────────
dataDir: "<home>\\.dsh\\profiles\\desktop\\data\\dsh-graft-slice"
oldTurnSummaryChars: 600
maxTurnChars: 6000
maxTotalChars: 24000
retireSource: true
verifyReadBack: true
skeletonTurn: 1
skeletonStep: 1
autoGraft: true
autoGraftAtRatio: 0.75
graftTargetGraceTurns: 2
