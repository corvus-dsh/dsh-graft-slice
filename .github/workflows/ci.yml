# CI — rebuild, prove the committed artifact is current, then test.
#
# `index.js` is committed build output (a single inlined bundle). Tests running against `src/` say
# nothing about whether that bundle is current or even parses, so CI rebuilds and diffs.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show the runtime we are actually testing on
        run: node --version && npm --version

      - name: Check out the layer this plugin writes through
        # ── WHY A SIBLING CHECKOUT AND NOT A SKIP ────────────────────────────────────────────
        #
        # The slice's write path goes THROUGH `dsh-paradise`. Its async tests are the only place that
        # path is exercised end to end — skipping them when the layer is missing would leave CI green
        # while never testing the thing this package exists to do.
        #
        # `dsh-paradise` is a sibling repository, so it is checked out BESIDE this one: the same
        # layout the workspace uses locally, so CI and a developer machine resolve it identically.
        #
        # ⚠️ The checkout path MUST stay INSIDE this job's workspace. `actions/checkout` refuses a
        # destination it cannot prove is under `$GITHUB_WORKSPACE`:
        #
        #   Repository path '/home/runner/work/dsh-graft-slice/dsh-paradise-checkout'
        #   is not under '/home/runner/work/dsh-graft-slice/dsh-graft-slice'
        #
        # So it lands in a staging directory inside the workspace and the next step MOVES it out to
        # the sibling position. `mv` is a plain filesystem rename — the runner user owns the parent
        # directory — so the layout the probe wants is reached without asking checkout to leave home.
        uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-paradise
          path: .siblings/dsh-paradise

      - name: Check out the sibling the panel tests render against
        # The panel-render tests load `dsh-memory/client.js` to prove this plugin's cells draw against
        # a foreign client bundle. Without it those tests fail on ENOENT — and a skip would mean the
        # render contract is never verified.
        uses: actions/checkout@v4
        with:
          repository: corvus-dsh/dsh-memory
          path: .siblings/dsh-memory

      - name: Place the siblings where the probes expect them
        # Both lookups use the DIRECTORY NAME (the repo name), not the scoped package name: this
        # workspace lays repos side by side by repo name, and the probes follow that layout.
        run: |
          set -e
          mv .siblings/dsh-paradise ../dsh-paradise
          mv .siblings/dsh-memory ../dsh-memory
          rm -rf .siblings
          node -e "console.log('paradise at', require('node:fs').realpathSync('../dsh-paradise/index.js'))"
          node -e "console.log('memory at', require('node:fs').realpathSync('../dsh-memory/client.js'))"

      - name: Install (no dependencies expected)
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: The build must not leave the committed artifact stale
        # WHY `git diff --exit-code` AND NOT `git status --porcelain`
        #
        # `git status` answers "does the file differ from what the stat cache remembers", and with
        # `core.autocrlf=true` (the default on a Windows clone) it can answer YES for a file whose
        # CONTENT is byte-identical to the committed blob — git wants to convert the worktree file to
        # CRLF "the next time it touches it", and reports the pending conversion as a modification.
        #
        # Measured on a fresh clone of this repo: after `npm run build`, `git hash-object index.js`
        # equals the committed blob exactly, `git diff --exit-code` exits 0 — and `git status
        # --porcelain` still prints ` M index.js`. A staleness gate built on `status` would fail a
        # perfectly current artifact on every Windows machine.
        #
        # `git diff --exit-code` compares content after the repo's configured filters, which is the
        # same normalization `git status` applies — so it agrees with `status` on real edits but not
        # on pending-EOL noise. That is exactly the discrimination this gate needs.
        #
        # ⚠️ DO NOT "fix" this by pinning `core.autocrlf=false`. That disables the normalization
        # instead of relying on it, and on a worktree with CRLF bytes it turns pure EOL churn into a
        # whole-file diff. Measured on dsh-memory: `lib/index.js` has 1664 CR bytes in the worktree,
        # plain `git diff` exits 0, and `git -c core.autocrlf=false diff` reports 7 files changed /
        # 7674 insertions / 7674 deletions of NOTHING.
        run: |
          if ! git diff --exit-code -- index.js; then
            echo "::error::The build changed committed artifacts. Run 'npm run build' and commit the result."
            git --no-pager diff --stat -- index.js
            exit 1
          fi
          echo "ok: index.js matches the committed artifact"

      - name: Syntax-check the shipped entry point
        run: node --check index.js

      - name: Test
        run: npm test

      # ── the export surface gate ────────────────────────────────────────────────────────────────
      #
      # `verify-bundle` was only ever run by hand, so its 28 checks — including the export-surface
      # contract added in v0.9.5 — were never enforced on a push. A gate nobody runs is a comment.
      #
      # It runs AFTER `npm test` on purpose: a broken bundle should fail on the tests, with a test
      # name to read, rather than on a packaging check that reports one line.
      #
      # `GRAFT_COMMIT_MESSAGE` is what lets an INTENTIONAL surface change pass. The gate compares the
      # export count against `.export-surface.json` and demands `[export-change]` in the message when
      # they differ; without this env var a declared change would be indistinguishable from an
      # accident, and the honest fix would be to switch the gate off. The subject line is enough —
      # the convention puts the marker there.
      # ── THE DOCUMENTATION GATES, NOW ACTUALLY RUN ─────────────────────────────────────────────
      #
      # These existed and were never run here, so the same commit could have CI green while
      # `check-readme-counts` was red (measured: ARCHITECTURE quoted a stale line count). The
      # workflow file itself says it: "A gate nobody runs is a comment."
      #
      # They run AFTER `npm test` on purpose: a behavioural break should fail with a test name to
      # read, not with a documentation mismatch that is a symptom of it.
      - name: Documentation counts match the code
        run: node scripts/check-readme-counts.mjs

      # ── check-docs WAS THE ONE GATE NOBODY RAN ───────────────────────────────────────────────────
      #
      # Measured on N2: moving the command policy layer into `core/command-policy.ts` made
      # `check-docs` report 26 facts instead of 27 — the missing one was `docs: command guard
      # documented`, whose marker lived in the file the function left. NOTHING FAILED. It was found
      # only because it was run by hand, which is the same reason `check-readme-counts` was red in a
      # green CI before it was wired in: "A gate nobody runs is a comment."
      #
      # The marker scan now covers all of src/ and a marker found nowhere is a FAILURE, so this step
      # is what keeps that from regressing silently again.
      - name: Documentation contract (features and structure named in the README)
        run: node scripts/check-docs.mjs

      # The pass/skip SPLIT, not just the total: a guard that quietly becomes a skip keeps the total
      # identical, and that is exactly how coverage shrinks without anyone noticing.
      - name: README test tally (passed + skipped == total, all measured)
        run: node scripts/check-readme-tally.mjs
      - name: Bundle contract, including the export surface
        env:
          GRAFT_COMMIT_MESSAGE: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: node scripts/verify-bundle.mjs

      # The baseline is a COMMITTED file, so a declared change that refreshes it must land in the same
      # commit. If CI refreshed it silently, the next clone would inherit a contract nobody reviewed.
      - name: The export baseline must already be committed
        run: |
          if [ -n "$(git status --porcelain .export-surface.json)" ]; then
            echo "::error::verify-bundle.mjs rewrote .export-surface.json. Commit the new baseline: it is part of the export contract."
            git --no-pager diff -- .export-surface.json
            exit 1
          fi
          echo "ok: .export-surface.json is committed and current"

      # ── the committed artifact must be what this source builds ────────────────────────────────
      #
      # CI already had this check inline (git diff --exit-code -- index.js earlier in the job),
      # but run #110 went red for a cause that was fully visible LOCALLY: a benchmark copied the
      # previous artifact into place to measure a baseline and restored it in a finally, silently
      # reverting a build. Same check, one step earlier, where it costs a second instead of a run.
      - name: The committed artifact is what this source builds
        run: node scripts/check-artifact-fresh.mjs

      # ── the dependency graph must stay acyclic ────────────────────────────────────────────────
      #
      # Added because the type-fix aimed at the 121 "Cannot find name" diagnostics works by adding
      # IMPORT statements (graftError ×49, GraftConfig ×18, …). Each import is an edge, and the one
      # way such a repair can turn a green tree into a broken one is a cycle. `stripTypeScriptTypes`
      # erases imports outright, so neither the build nor any test would see it.
      #
      # Measured while planning that fix: `core/watermark.ts -> ./pending-state` WOULD have closed
      # `watermark -> pending-state -> task-state -> watermark`. It was caught before writing, by
      # simulating the proposed edges — which is the reason this gate exists rather than a note.
      - name: The module dependency graph has no cycles
        run: node scripts/check-cycles.mjs

      # ── the incremental type budget ───────────────────────────────────────────────────────────
      #
      # ── THIS GATE CANNOT MEASURE ON THIS RUNNER, AND SAYS SO OUT LOUD ─────────────────────────
      #
      # `package.json` declares no dependencies, so there is no `typescript` here and
      # `type-budget.mjs` exits 2 by design ("a RESOURCE condition, not a pass").
      #
      # Two wrong ways to handle that, both rejected:
      #   1. add typescript as a devDependency — turns the gate into a 15-error red build on every
      #      push, which is the "CI is always red" failure the user rejected by name;
      #   2. `exit 0` silently — a green step that never ran is a lie.
      #
      # The rule (user ruling 2026-11-12): report RESOURCE and exit 0, but the LOG MUST SAY the
      # check did not happen. Same shape as `t.skip('RESOURCE: …')` in test/v143.
      #
      # This is also the answer to "a gate nobody runs is a comment" — the reason `check-cycles`
      # shipped a hard-coded `D:/` path that passed locally and failed here (#118) is that nobody
      # was running it. Now the step runs on every push, and when it cannot measure, the log says so.
      - name: Incremental type budget (needs a compiler the runner does not have)
        run: |
          set +e
          node scripts/type-budget.mjs
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::TYPE BUDGET NOT CHECKED THIS RUN — no typescript on the runner."
            echo "  This is a RESOURCE condition, not a pass: the 15-defect baseline was NOT verified."
            echo "  It is enforced on any machine that has a compiler (and by test/v143 there)."
            exit 0
          fi
          if [ "$code" -ne 0 ]; then
            echo "::error::type-budget FAILED — a touched file gained type errors."
            exit "$code"
          fi
          echo "type-budget: enforced and green."

      # ── exact identifier references, never substring matches ──────────────────────────────────
      #
      # Observed twice: includes('GraftSource') also matched GraftSourceShape and pendingGraftSources,
      # which produced "referenced by 5 core/ modules" — a confident, wrong statement. This runs the
      # tool on a symbol whose answer is known, so the classifier is exercised on every push.
      - name: Symbol reference lookup is exact (never a substring)
        run: |
          node scripts/who-references.mjs --json buildTape > /tmp/refs.json
          node -e "
            const refs = require('/tmp/refs.json');
            const decl = refs.filter((r) => r.kind === 'DECL');
            if (decl.length !== 1) { console.error('expected exactly one DECL for buildTape, got ' + decl.length); process.exit(1); }
            console.log('ok: exact identifier matching, prose reported separately (' + refs.length + ' findings)');
          "
